<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wirely — Create account</title>
  <meta name="description" content="Wirely — Fast. Private. Connected." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="splash" id="splashScreen">
    <svg viewBox="0 0 100 100"><path class="splash-bolt" d="M58 4 L18 54 L46 54 L40 96 L84 40 L54 40 Z" /></svg>
    <div class="splash-wordmark"><h1>Wirely</h1><p>Fast. Private. Connected.</p></div>
  </div>

  <div class="auth-shell">
    <div class="auth-card">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 100 100" fill="currentColor"><path d="M58 4 L18 54 L46 54 L40 96 L84 40 L54 40 Z" /></svg>
        <h1>Wirely</h1>
      </div>
      <p class="tagline">Set up your line</p>

      <div class="form-error" id="formError"></div>

      <form id="registerForm" novalidate>
        <div class="field">
          <label for="displayName">Display name</label>
          <input type="text" id="displayName" name="displayName" autocomplete="name" maxlength="40" />
        </div>
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" required />
          <p class="field-hint">3–20 characters: letters, numbers, underscores.</p>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="new-password" required />
          <p class="field-hint">At least 8 characters.</p>
        </div>
        <button type="submit" class="btn-primary" id="submitBtn">Create account</button>
      </form>

      <p class="auth-switch">Already have an account? <a href="/index.html">Sign in</a></p>
    </div>
  </div>

  <script src="/js/splash.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/register.js"></script>
</body>
</html>
